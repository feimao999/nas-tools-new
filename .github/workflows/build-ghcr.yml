name: Build GHCR Image
on:
  workflow_dispatch:
    inputs:
      custom_tag:
        description: '可选自定义版本号标签（例如 v1.2.0，留空则仅使用自动递增版本号）'
        required: false
        default: ''
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'tests/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: build-ghcr
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and push image to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release version
        run: |
          app_version=$(cat version.py | sed -ne "s/APP_VERSION\s=\s'v\(.*\)'/\1/gp")
          build_date=$(TZ=Asia/Shanghai date +%Y%m%d)
          echo "app_version=${app_version}" >> $GITHUB_ENV
          echo "build_date=${build_date}" >> $GITHUB_ENV

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ env.app_version }}.${{ github.run_number }}
            type=raw,value=${{ env.build_date }}-b${{ github.run_number }}
            type=raw,value=${{ github.event.inputs.custom_tag }},enable=${{ github.event.inputs.custom_tag != '' }}
            type=ref,event=tag
            type=sha,format=short

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
