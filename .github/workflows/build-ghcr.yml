name: Build GHCR Image
on:
  workflow_dispatch:
    inputs:
      custom_tag:
        description: '可选自定义版本号标签（例如 v4.1.0，留空则仅使用自动递增版本号）'
        required: false
        default: ''
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'tests/**'
      - '.github/workflows/**'

permissions:
  contents: write
  packages: write

concurrency:
  group: build-ghcr
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and push image to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release version
        run: |
          app_version=$(cat version.py | sed -ne "s/APP_VERSION\s*=\s*'v\(.*\)'/\1/gp")
          latest_patch=$(git tag -l "v${app_version}.*" | sed -E "s/^v${app_version}\.([0-9]+)$/\1/" | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)
          if [ -z "$latest_patch" ]; then
            next_patch=0
          else
            next_patch=$((latest_patch + 1))
          fi
          full_version="v${app_version}.${next_patch}"
          build_date=$(TZ=Asia/Shanghai date +%Y%m%d)
          echo "app_version=${app_version}" >> $GITHUB_ENV
          echo "full_version=${full_version}" >> $GITHUB_ENV
          echo "build_date=${build_date}" >> $GITHUB_ENV
          echo "Computed release version: ${full_version}"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.full_version }}
            type=raw,value=${{ env.build_date }}-b${{ github.run_number }}
            type=raw,value=${{ github.event.inputs.custom_tag }},enable=${{ github.event.inputs.custom_tag != '' }}
            type=sha,format=short

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_VERSION=${{ env.full_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.full_version }}
          DATE_TAG: ${{ env.build_date }}-b${{ github.run_number }}
          CUSTOM_TAG: ${{ github.event.inputs.custom_tag }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGES=$(git log -n 5 --pretty=format:"- %s (%h)" --no-merges)
          fi
          if [ -z "$CHANGES" ]; then
            CHANGES="- 重新构建并发布镜像 (${SHORT_SHA})"
          fi
          {
            echo "## 变更记录${PREV_TAG:+（对比 ${PREV_TAG}）}"
            echo "${CHANGES}"
            echo ""
            echo "## Docker 镜像拉取"
            echo '```bash'
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY}:${RELEASE_TAG}"
            echo '```'
            echo ""
            echo "**可用标签**：\`${RELEASE_TAG}\`、\`${DATE_TAG}\`${CUSTOM_TAG:+、\`${CUSTOM_TAG}\`}、\`latest\`"
          } > /tmp/release_notes.md
          gh release create "${RELEASE_TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TAG}" \
            --notes-file /tmp/release_notes.md
